<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" font-family="Arial, sans-serif">

  <!-- Background -->
  <rect width="960" height="440" fill="#f8f9fa" rx="12"/>

  <!-- Title -->
  <text x="480" y="38" text-anchor="middle" font-size="18" font-weight="bold" fill="#2d3436">Embedding-Based Partitioning Pipeline</text>

  <!-- Arrow marker -->
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#636e72"/>
    </marker>
  </defs>

  <!-- ── Step 1: Embedding Extraction ── -->
  <rect x="20" y="65" width="175" height="130" rx="10" fill="#dfe6e9" stroke="#b2bec3" stroke-width="1.5"/>
  <text x="107" y="88" text-anchor="middle" font-size="11" font-weight="bold" fill="#2d3436">Step 1</text>
  <text x="107" y="104" text-anchor="middle" font-size="10" fill="#636e72">Embedding Extraction</text>
  <line x1="40" y1="112" x2="175" y2="112" stroke="#b2bec3" stroke-width="1"/>
  <!-- model tags -->
  <rect x="34" y="119" width="57" height="20" rx="4" fill="#74b9ff" stroke="none"/>
  <text x="62" y="133" text-anchor="middle" font-size="9" font-weight="bold" fill="#fff">DINOv2</text>
  <rect x="98" y="119" width="40" height="20" rx="4" fill="#a29bfe" stroke="none"/>
  <text x="118" y="133" text-anchor="middle" font-size="9" font-weight="bold" fill="#fff">CLIP</text>
  <rect x="34" y="145" width="45" height="20" rx="4" fill="#fd79a8" stroke="none"/>
  <text x="56" y="159" text-anchor="middle" font-size="9" font-weight="bold" fill="#fff">SigLIP</text>
  <rect x="85" y="145" width="35" height="20" rx="4" fill="#55efc4" stroke="none"/>
  <text x="102" y="159" text-anchor="middle" font-size="9" font-weight="bold" fill="#2d3436">MAE</text>
  <text x="107" y="183" text-anchor="middle" font-size="9" fill="#636e72">→ feature vector</text>

  <!-- Arrow 1→2 -->
  <line x1="195" y1="130" x2="228" y2="130" stroke="#636e72" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ── Step 2: Pooling ── -->
  <rect x="230" y="65" width="165" height="130" rx="10" fill="#dfe6e9" stroke="#b2bec3" stroke-width="1.5"/>
  <text x="312" y="88" text-anchor="middle" font-size="11" font-weight="bold" fill="#2d3436">Step 2</text>
  <text x="312" y="104" text-anchor="middle" font-size="10" fill="#636e72">Token Pooling</text>
  <line x1="248" y1="112" x2="378" y2="112" stroke="#b2bec3" stroke-width="1"/>
  <text x="312" y="129" text-anchor="middle" font-size="9.5" fill="#2d3436">CLS · Mean · Max</text>
  <text x="312" y="146" text-anchor="middle" font-size="9.5" fill="#2d3436">GeM · Spectral</text>
  <text x="312" y="163" text-anchor="middle" font-size="9.5" fill="#2d3436">Last-K layers</text>
  <text x="312" y="183" text-anchor="middle" font-size="9" fill="#636e72">→ single vector / image</text>

  <!-- Arrow 2→3 -->
  <line x1="395" y1="130" x2="428" y2="130" stroke="#636e72" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ── Step 3: Dim Reduction ── -->
  <rect x="430" y="65" width="155" height="130" rx="10" fill="#dfe6e9" stroke="#b2bec3" stroke-width="1.5"/>
  <text x="507" y="88" text-anchor="middle" font-size="11" font-weight="bold" fill="#2d3436">Step 3</text>
  <text x="507" y="104" text-anchor="middle" font-size="10" fill="#636e72">Dim. Reduction</text>
  <line x1="448" y1="112" x2="568" y2="112" stroke="#b2bec3" stroke-width="1"/>
  <rect x="458" y="120" width="48" height="20" rx="4" fill="#fdcb6e" stroke="none"/>
  <text x="482" y="134" text-anchor="middle" font-size="9" font-weight="bold" fill="#2d3436">UMAP</text>
  <rect x="514" y="120" width="48" height="20" rx="4" fill="#b2bec3" stroke="none"/>
  <text x="538" y="134" text-anchor="middle" font-size="9" font-weight="bold" fill="#2d3436">optional</text>
  <text x="507" y="163" text-anchor="middle" font-size="9.5" fill="#2d3436">reduce to 2–50 dims</text>
  <text x="507" y="183" text-anchor="middle" font-size="9" fill="#636e72">→ compressed space</text>

  <!-- Arrow 3→4 -->
  <line x1="585" y1="130" x2="618" y2="130" stroke="#636e72" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ── Step 4: Clustering ── -->
  <rect x="620" y="65" width="165" height="130" rx="10" fill="#dfe6e9" stroke="#b2bec3" stroke-width="1.5"/>
  <text x="702" y="88" text-anchor="middle" font-size="11" font-weight="bold" fill="#2d3436">Step 4</text>
  <text x="702" y="104" text-anchor="middle" font-size="10" fill="#636e72">Clustering</text>
  <line x1="638" y1="112" x2="768" y2="112" stroke="#b2bec3" stroke-width="1"/>
  <text x="702" y="129" text-anchor="middle" font-size="9.5" fill="#2d3436">HDBSCAN (auto-K)</text>
  <text x="702" y="146" text-anchor="middle" font-size="9.5" fill="#2d3436">K-Means · K-NN graph</text>
  <text x="702" y="163" text-anchor="middle" font-size="9.5" fill="#2d3436">Spectral clustering</text>
  <text x="702" y="183" text-anchor="middle" font-size="9" fill="#636e72">→ semantic groups</text>

  <!-- Arrow 4→output -->
  <line x1="785" y1="130" x2="818" y2="130" stroke="#636e72" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Output -->
  <rect x="820" y="93" width="120" height="74" rx="10" fill="#55efc4" stroke="#00b894" stroke-width="1.5"/>
  <text x="880" y="120" text-anchor="middle" font-size="10" font-weight="bold" fill="#2d3436">FL Client</text>
  <text x="880" y="135" text-anchor="middle" font-size="10" font-weight="bold" fill="#2d3436">Partitions</text>
  <text x="880" y="153" text-anchor="middle" font-size="9" fill="#2d3436">non-IID splits</text>

  <!-- ── Models row ── -->
  <text x="480" y="240" text-anchor="middle" font-size="12" font-weight="bold" fill="#2d3436">Foundation Models</text>

  <!-- DINOv2 -->
  <rect x="30" y="255" width="200" height="80" rx="8" fill="#fff" stroke="#74b9ff" stroke-width="1.5"/>
  <text x="130" y="275" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#0984e3">DINOv2 (Meta AI)</text>
  <text x="130" y="292" text-anchor="middle" font-size="9.5" fill="#636e72">Self-supervised ViT</text>
  <text x="130" y="307" text-anchor="middle" font-size="9.5" fill="#636e72">Small · Base · Large · Giant</text>
  <text x="130" y="322" text-anchor="middle" font-size="9" fill="#b2bec3">384 – 1536 dims</text>

  <!-- CLIP -->
  <rect x="248" y="255" width="200" height="80" rx="8" fill="#fff" stroke="#a29bfe" stroke-width="1.5"/>
  <text x="348" y="275" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#6c5ce7">CLIP (OpenAI)</text>
  <text x="348" y="292" text-anchor="middle" font-size="9.5" fill="#636e72">Vision-language alignment</text>
  <text x="348" y="307" text-anchor="middle" font-size="9.5" fill="#636e72">Base-32 · Base-16 · Large-14</text>
  <text x="348" y="322" text-anchor="middle" font-size="9" fill="#b2bec3">512 – 768 dims</text>

  <!-- SigLIP -->
  <rect x="466" y="255" width="200" height="80" rx="8" fill="#fff" stroke="#fd79a8" stroke-width="1.5"/>
  <text x="566" y="275" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#e84393">SigLIP (Google)</text>
  <text x="566" y="292" text-anchor="middle" font-size="9.5" fill="#636e72">Improved CLIP (sigmoid loss)</text>
  <text x="566" y="307" text-anchor="middle" font-size="9.5" fill="#636e72">Base-16-224 · Large-16-256</text>
  <text x="566" y="322" text-anchor="middle" font-size="9" fill="#b2bec3">768 – 1024 dims</text>

  <!-- MAE -->
  <rect x="684" y="255" width="200" height="80" rx="8" fill="#fff" stroke="#55efc4" stroke-width="1.5"/>
  <text x="784" y="275" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#00b894">MAE (Meta AI)</text>
  <text x="784" y="292" text-anchor="middle" font-size="9.5" fill="#636e72">Masked autoencoder</text>
  <text x="784" y="307" text-anchor="middle" font-size="9.5" fill="#636e72">Base · Large</text>
  <text x="784" y="322" text-anchor="middle" font-size="9" fill="#b2bec3">768 – 1024 dims</text>

  <!-- ── Heterogeneity control ── -->
  <rect x="30" y="360" width="900" height="62" rx="10" fill="#fff" stroke="#b2bec3" stroke-width="1.2"/>
  <text x="480" y="382" text-anchor="middle" font-size="11" font-weight="bold" fill="#2d3436">Heterogeneity Control — β ∈ [0, 1]</text>
  <text x="200" y="402" text-anchor="middle" font-size="10" fill="#636e72">β → 0</text>
  <!-- gradient bar -->
  <defs>
    <linearGradient id="betaGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#74b9ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d63031;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect x="280" y="392" width="400" height="14" rx="7" fill="url(#betaGrad)"/>
  <text x="760" y="402" text-anchor="middle" font-size="10" fill="#636e72">β → 1</text>
  <text x="200" y="416" text-anchor="middle" font-size="9" fill="#74b9ff">larger clusters (IID-like)</text>
  <text x="760" y="416" text-anchor="middle" font-size="9" fill="#d63031">smaller clusters (highly non-IID)</text>

</svg>
